services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart
      POSTGRES_DB: kart
    ports:
      - "5432:5432"
    volumes:
      - kartdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart"]
      interval: 3s
      retries: 20
volumes:
  kartdb:
